data:
  embeddings_path: "dataset/georgia_ecg-fm_max_pooled.csv"
  metadata_path: "dataset/meta_dataset.csv"
  join_key: "ecg_id"
  cols_to_exclude: ["ecg_id", "AF", "sex", "age", "SB", "STach", "CD"]
  metadata_to_concatenate: []

experiment:

  model_type: "logistic_regression"
  target_column: "AF"
  bias_attribute: "sex"


  random_seed: 42
  n_splits: 10
  test_size: 0.2

  n_features_to_remove_shap: 20
  sample_size_shap: 200
  
 
  male_value: 0
  female_value: 1

  # Opzioni: "target", "bias", "both", "none"
  balancing_strategy: "both"


grid_search:
  enabled: true
  cv_splits: 5

  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [None, 10, 20]
    min_samples_split: [2, 5, 10]

  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
    solver: ["lbfgs", "liblinear"]
