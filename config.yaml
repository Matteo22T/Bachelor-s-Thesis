data:
  foundation_models:
    - name: "ECG-FM"
      run: true
      datasets:
        - name: "georgia_ecgfm"
          embedding_path: "dataset/georgia/georgia_ecg-fm_max_pooled.csv"
          metadata_path: "dataset/georgia/meta_dataset.csv"
          run: true
        - name: "chapman_ecgfm"
          embedding_path: "dataset/chapman-ningbo/chapman-ningbo_ecg-fm_max_pooled.csv"
          metadata_path: "dataset/chapman-ningbo/meta_dataset.csv"
          run: true

    - name: "HuBERT"
      run: true
      datasets:
        - name: "georgia_hubert_ecg_base"
          embedding_path: "dataset/georgia/georgia_hubert-ecg-base_max_pooled.csv"
          metadata_path: "dataset/georgia/meta_dataset.csv"
          run: true
        - name: "chapman_hubert_ecg_base"
          embedding_path: "dataset/chapman-ningbo/chapman-ningbo_hubert-ecg-base_max_pooled.csv"
          metadata_path: "dataset/chapman-ningbo/meta_dataset.csv"
          run: false

  join_key: "ecg_id"
  cols_to_exclude: ["ecg_id", "AF", "sex", "age", "SB", "STach", "CD", "TAb"]
  metadata_to_concatenate: []

experiment:

  model_type: "logistic_regression" # Opzioni: "random_forest", "logistic_regression"
  target_column: ["AF"]
  bias_attribute: ["sex"]

  force_retrain: false

  save_results_csv: true
  results_csv_path: "results/experiments_log.csv"

  save_filtered_embeddings: true

  task1: false
  task2: false
  task3: false
  task4: false
  task5: false
  task6: false
  task7: false
  runOverlapAnalysis: false

  random_seed: 42
  n_splits: 10
  test_size: 0.2

  remove_correlated_features: false
  correlation_threshold: 0.98


  n_features_to_remove_shap: [25, 50, 75, 100, 150, 200, 300, 400, 512]
  sample_size_shap: 500

  n_features_to_remove_shap_efficiency: [150, 200, 250, 300, 400, 512, 600, 650, 700, 758]

  georgia_ecgfm:
      best_t4: 25
      best_t7: 650
  georgia_hubert_ecg_base:
      best_t4: 50
      best_t7: 512
  
 
  male_value: 0
  female_value: 1

  # Opzioni: "target", "bias", "both", "none"
  balancing_strategy: "both"


grid_search:
  enabled: true
  cv_splits: 10


  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [None, 10, 20]
    min_samples_split: [2, 5, 10]

  
  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
    solver: ["lbfgs", "liblinear"]
    penalty: ["l1", "l2"]
    max_iter: [100, 500, 1000]
