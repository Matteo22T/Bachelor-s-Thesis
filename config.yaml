data:
  embeddings_path: "dataset/georgia/georgia_ecg-fm_max_pooled.csv"
  metadata_path: "dataset/georgia/meta_dataset.csv"
  join_key: "ecg_id"
  cols_to_exclude: ["ecg_id", "AF", "sex", "age", "SB", "STach", "CD"]
  metadata_to_concatenate: []

experiment:

  model_type: "random_forest" # Opzioni: "random_forest", "logistic_regression"
  target_column: ["AF"]
  bias_attribute: ["sex"]

  force_retrain: false

  save_results_csv: false
  results_csv_path: "results/experiments_log.csv"

  save_filtered_embeddings: true

  task1: false
  task2: false
  task3: false
  task4: true

  random_seed: 42
  n_splits: 10
  test_size: 0.2


  n_features_to_remove_shap: [25, 50, 75, 100, 150, 200, 300, 400, 512]
  sample_size_shap: 200
  
 
  male_value: 0
  female_value: 1

  # Opzioni: "target", "bias", "both", "none"
  balancing_strategy: "both"


grid_search:
  enabled: true
  cv_splits: 10


  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [None, 10, 20]
    min_samples_split: [2, 5, 10]

  
  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
    solver: ["lbfgs", "liblinear"]
    penalty: ["l1", "l2"]
    max_iter: [100, 500, 1000]
